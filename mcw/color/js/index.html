<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simanelix Armor Dyeing Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="split">
        <div>
            <p id="input_wrapper">Input for je_lab.zip: <input type="file" id="my_file_input"></p>
            <p>Select color: <input type="color" id="target_color"></p>
            <p><button id="load_main">Load main <i>JE</i> recipes</button></p>
            <p><button id="load_2x2">Load 2x2 recipes</button></p>
            <p><button id="load_brown">Load minimum brown recipes</button></p>
            <p><button id="load_1_4_3">Load 1.4.3 recipes</button></p>
            <p><button id="load_12w34a">Load 12w34a recipes</button></p>
            <p><button id="load_be">Load <i>BE</i> recipes</button></p>
            <p>If a recipe set fails to load, see the error in the dev console.</p>
        </div>
        <div>
            <p id="output">Output recipe will go here.</p>
            <script src="main.js"></script>
        </div>
    </div>
</body>
</html>
